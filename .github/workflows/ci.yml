name: CI

on:
  pull_request:
  push:
    branches: [main]

# This workflow only reads the tree — it never comments, labels or pushes.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so a stale bun.lock fails here rather than silently
      # resolving different versions than the ones anyone tested against.
      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run format:check

      - run: bun run tokens:check

      # No secrets needed: without Keycloak env the home page builds with an
      # empty member list.
      - run: bun run build

  # Builds the image once with the Keycloak secrets as build mounts, runs
  # deploy/smoke.sh against it and pushes it as candidate-<tree>. promote
  # makes it tree-<tree> once every job passed, and release ships only a
  # tree- image.
  image:
    uses: zyx1121/.github/.github/workflows/image.yml@main
    permissions:
      contents: read
      packages: write
    secrets:
      build-env: >-
        {
        "KEYCLOAK_URL": ${{ toJSON(secrets.KEYCLOAK_URL) }},
        "KEYCLOAK_REALM": ${{ toJSON(secrets.KEYCLOAK_REALM) }},
        "KEYCLOAK_ADMIN_CLIENT_ID": ${{ toJSON(secrets.KEYCLOAK_ADMIN_CLIENT_ID) }},
        "KEYCLOAK_ADMIN_CLIENT_SECRET": ${{ toJSON(secrets.KEYCLOAK_ADMIN_CLIENT_SECRET) }}
        }
    with:
      images: '[{"name": "ghcr.io/nycu-winlab/www.winlab.tw"}]'
      smoke: bash deploy/smoke.sh

  promote:
    needs: [check, image]
    uses: zyx1121/.github/.github/workflows/promote.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '["ghcr.io/nycu-winlab/www.winlab.tw"]'
