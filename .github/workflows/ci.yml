name: CI

on:
  pull_request:
  push:
    branches: [main]

# This workflow only reads the tree — it never comments, labels or pushes.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so a stale bun.lock fails here rather than silently
      # resolving different versions than the ones anyone tested against.
      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      # No secrets needed: without Keycloak env the home page builds with an
      # empty member list.
      - run: bun run build

