name: ${COMPOSE_PROJECT_NAME:-www}

services:
  web:
    image: ghcr.io/nycu-winlab/www.winlab.tw:${WWW_VERSION:-main}
    restart: unless-stopped
    init: true
    stop_grace_period: 3s
    # Keycloak for the hourly member list, and OpenTelemetry.
    env_file: ${WWW_ENV_FILE:-/srv/apps/www/env}
    environment:
      WWW_VERSION: ${WWW_VERSION:-dev}
    ports:
      - ${WWW_BIND:-0.0.0.0}:${WWW_PORT:-3000}:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 10s
      retries: 10
      start_period: 60s
      start_interval: 1s
