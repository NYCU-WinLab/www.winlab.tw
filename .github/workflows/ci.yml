name: CI

on:
  pull_request:
  push:
    branches: [main]

# This workflow only reads the tree — it never comments, labels or pushes.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so a stale bun.lock fails here rather than silently
      # resolving different versions than the ones anyone tested against.
      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      # No secrets needed: Keycloak and Supabase are read at request time, and
      # lib/supabase/config.ts degrades gracefully when the env is absent, so
      # the production build completes without any environment configured.
      - run: bun run build

      # The /directory CSP allow-lists next-themes' inline script by hash.
      # This fails the build if that script drifts, rather than letting the
      # stale hash reach production as a light-mode flash on /directory.
      - run: bun run verify:csp-hash
